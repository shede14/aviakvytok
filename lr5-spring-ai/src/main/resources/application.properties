spring.application.name=aviakvytok-ai
# Основний застосунок АвіаКвиток (ЛР2-ЛР4) працює на 8080, AI-модуль — на 8081
server.port=8081

# ---------- Spring AI / OpenAI ----------
# Ключ береться зі змінної середовища OPENAI_API_KEY (у коді та в Git його немає).
# Якщо змінна не задана, застосунок усе одно стартує і покаже підказку на сторінці.
spring.ai.openai.api-key=${OPENAI_API_KEY:no-key}
spring.ai.openai.chat.options.temperature=0

# Провайдер. Spring AI OpenAI працює з будь-яким OpenAI-сумісним API — змінюються лише URL і модель.
# За замовчуванням — Groq (безкоштовний тариф, OpenAI-сумісний API, відкрита модель OpenAI gpt-oss-120b).
# Для оригінального OpenAI (платно) задайте змінні середовища:
#   OPENAI_BASE_URL=https://api.openai.com
#   OPENAI_MODEL=gpt-4o-mini
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openai/gpt-oss-120b}

# Використовуємо лише чат-модель — решту автоконфігурацій вимикаємо
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.thymeleaf.cache=false
logging.level.ua.kneu.aviakvytok.ai=DEBUG
