spring.application.name=aviakvytok

# Підключення до PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/aviakvytok
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: автоматична генерація схеми
# create - таблиці створюються заново під час кожного запуску
# update - схема лише доповнюється (для подальшої роботи)
spring.jpa.hibernate.ddl-auto=create

# Відображення SQL-запитів у консолі
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
