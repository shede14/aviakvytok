spring.application.name=aviakvytok

# Підключення до PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/aviakvytok
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: автоматична генерація схеми
# update - схема доповнюється, дані між запусками зберігаються (ЛР3)
# create - таблиці створюються заново під час кожного запуску (ЛР2)
spring.jpa.hibernate.ddl-auto=update

# Відображення SQL-запитів у консолі
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# REST-сервер (ЛР3)
server.port=8080
spring.jackson.serialization.indent-output=true

# Дозволені джерела для CORS (фронтенд на Vue.js)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Мова повідомлень валідації (незалежно від мови ОС)
spring.web.locale=uk_UA
spring.web.locale-resolver=fixed
