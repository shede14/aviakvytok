spring.application.name=aviakvytok-excel
# ЛР2-ЛР4 — порт 8080, ЛР5 — 8081, ЛР6 — 8082
server.port=8082

# PostgreSQL (та сама база aviakvytok, що й у ЛР2-ЛР4; таблиця ticket_sales)
spring.datasource.url=jdbc:postgresql://localhost:5432/aviakvytok
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Обмеження розміру файлу, що завантажується
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.ua.kneu.aviakvytok.excel=DEBUG
