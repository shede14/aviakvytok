spring.application.name=aviakvytok-security
# ЛР2-ЛР4 — 8080, ЛР5 — 8081, ЛР6 — 8082, ЛР7 — 8083
server.port=8083

# PostgreSQL (база aviakvytok; таблиці users, roles, users_roles)
spring.datasource.url=jdbc:postgresql://localhost:5432/aviakvytok
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Сесія: cookie лише для HTTP, тайм-аут неактивності 30 хв
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie

spring.thymeleaf.cache=false
logging.level.ua.kneu.aviakvytok.security=DEBUG
